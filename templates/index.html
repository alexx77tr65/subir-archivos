DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
          
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
        }
        h1 { margin-top: 0; }
        p { color: #4b5563; }
        .button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.85rem 1.75rem;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .button:hover { background: #1d4ed8; }
        .button.secondary {
            background: #ffffff;
            color: #2563eb;
            border: 2px solid #2563eb;
            margin-left: 0.5rem;
        }
        .button.secondary:hover { background: #eff6ff; }
    </style>
</head>
<body>
    <main class="card">
        <h1>{{ title }}</h1>
        <p>Demostracion de la libreria <strong>xhtml2pdf</strong> con FastAPI y plantillas Jinja2.</p>
        <p>Primero veras una vista previa en HTML y desde ahi podras descargar el PDF con {{ products_count }} productos de ejemplo.</p>
        <a class="button" href="/report">Ver y descargar PDF</a>
        <a class="button secondary" href="/report/logo">Ver y descargar PDF con logo</a>
    </main>
</body>
</html>
